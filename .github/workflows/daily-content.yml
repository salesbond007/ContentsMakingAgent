name: Daily Content Pipeline

on:
  schedule:
    # 07:00 JST = 22:00 UTC(前日)。
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "手動実行: 記事にしたいキーワード(空欄なら自動選定)"
        required: false
        type: string
      cta_id:
        description: "手動実行: 使用するCTAのid(config/ctas.json参照。keywordが空でCTAのみ指定した場合はCTAから逆算してキーワードを提案)"
        required: false
        type: string
      source_urls:
        description: "手動実行: 参考にしたいURL(カンマ区切り、任意)"
        required: false
        type: string

jobs:
  generate-and-publish:
    # 手動実行(workflow_dispatch)は稼働停止中でも常に実行する。
    # スケジュール実行(cron)は、管理画面の「稼働停止」でPIPELINE_PAUSED=trueにされている間はスキップする。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PIPELINE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run start
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_ARTICLES_ENDPOINT: ${{ vars.MICROCMS_ARTICLES_ENDPOINT }}
          MICROCMS_KEYWORDS_ENDPOINT: ${{ vars.MICROCMS_KEYWORDS_ENDPOINT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          COMPETITOR_RSS_FEEDS: ${{ vars.COMPETITOR_RSS_FEEDS }}
          DAILY_ARTICLE_COUNT: ${{ vars.DAILY_ARTICLE_COUNT }}
          DAILY_API_CALL_CAP: ${{ vars.DAILY_API_CALL_CAP }}
          REVIEW_AUTO_PUBLISH_THRESHOLD: ${{ vars.REVIEW_AUTO_PUBLISH_THRESHOLD }}
          REVIEW_NEEDS_CHECK_THRESHOLD: ${{ vars.REVIEW_NEEDS_CHECK_THRESHOLD }}
          PUBLISH_TARGET_NAME: ${{ vars.PUBLISH_TARGET_NAME }}
          MANUAL_KEYWORD: ${{ github.event.inputs.keyword }}
          MANUAL_CTA_ID: ${{ github.event.inputs.cta_id }}
          MANUAL_SOURCE_URLS: ${{ github.event.inputs.source_urls }}

      # 自動実行(cron)の結果はSlackへ即時通知せず、data/pending-notifications.json に蓄積している。
      # 変更をコミット・pushして、21:00 JSTの通知ワークフローが読み取れるようにする。
      - name: Persist pending notifications
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -n "$(git status --porcelain data/pending-notifications.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/pending-notifications.json
            git commit -m "Record pending notifications from $(date -u +%Y-%m-%d) run"
            git push
          fi
