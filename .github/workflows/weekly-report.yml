name: Weekly Content Report

on:
  schedule:
    # 毎週月曜 21:10 JST = 12:10 UTC(同日)。直近7日分のdata/daily-stats.jsonを集計してSlackに送信する。
    - cron: "10 12 * * 1"
  workflow_dispatch: {}

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run weekly-report
        env:
          # loadConfig()のバリデーションを満たすために必須項目もすべて渡す。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_ARTICLES_ENDPOINT: ${{ vars.MICROCMS_ARTICLES_ENDPOINT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REWRITE_THRESHOLD_DAYS: ${{ vars.REWRITE_THRESHOLD_DAYS }}
