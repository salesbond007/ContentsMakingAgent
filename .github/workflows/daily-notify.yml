name: Daily Content Notify

on:
  schedule:
    # 21:00 JST = 12:00 UTC(同日)。07:00 JSTの自動実行(Daily Content Pipeline)が
    # data/pending-notifications.json に蓄積した1日分の結果をまとめてSlackに送信する。
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run notify
        env:
          # loadConfig()のバリデーションを満たすために必須項目もすべて渡す(notify.ts自体はSlack以外を使わない)。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit cleared notification log
        run: |
          if [ -n "$(git status --porcelain data/pending-notifications.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/pending-notifications.json
            git commit -m "Clear pending notifications after $(date -u +%Y-%m-%d) digest"
            git push
          fi
